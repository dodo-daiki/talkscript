[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "talkscript"
version = "0.1.0"
description = "発話（VOICEVOX）と関節ごとのキーフレームを 1 つの台本で書き、ロボットを発話に合わせて動かす"
readme = "README.md"
authors = [{ name = "dodo-daiki" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "sounddevice>=0.4"]

[project.optional-dependencies]
test = ["pytest", "python-can>=4.0"]

[project.scripts]
talkscript = "talkscript.cli:main"

[project.urls]
Repository = "https://github.com/dodo-daiki/talkscript"

[tool.setuptools]
packages = ["talkscript", "talkscript.robots"]

[tool.setuptools.package-data]
talkscript = ["defaults/*.toml", "defaults/config/robots/*.yaml", "defaults/config/gestures/*.yaml", "defaults/scripts/*.yaml"]

[tool.pytest.ini_options]
pythonpath = [".", "tools"]
testpaths = ["tests"]
