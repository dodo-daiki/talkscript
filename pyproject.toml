[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talkscript"
version = "0.2.1"
description = "発話（VOICEVOX）と関節ごとのキーフレームを 1 つの台本で書き、ロボットを発話に合わせて動かす"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dodo-daiki" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "sounddevice>=0.4"]

[project.optional-dependencies]
test = ["pytest", "python-can>=4.0"]

[project.scripts]
talkscript = "talkscript.cli:main"

[project.gui-scripts]
talkscript-gui = "talkscript.gui:main"

[project.urls]
Repository = "https://github.com/dodo-daiki/talkscript"

[tool.setuptools.packages.find]
include = ["talkscript*"]
namespaces = true                 # defaults/ 以下（.py のないフォルダ）も含める

[tool.setuptools.package-data]
"talkscript.defaults" = ["*.toml"]
"talkscript.defaults.config.robots" = ["*.yaml"]
"talkscript.defaults.config.gestures" = ["*.yaml"]
"talkscript.defaults.scripts" = ["*.yaml"]
"talkscript.gui.static" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = [".", "tools"]
testpaths = ["tests"]
